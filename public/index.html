<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
   <link rel="icon" type="image/png" sizes="1920x1920" href="/icons/icon-192x192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#08080C" />
    <meta name="description" content="Story Go – Advanced Audio Storytelling Platform. Stream your favorite audio series, continue from where you left off, and discover trending content." />
    <meta name="keywords" content="audio stories, podcast, audiobook, storytelling, story go" />

    <!-- Open Graph -->
    <meta property="og:title" content="Story Go – Audio Stories & Series" />
    <meta property="og:description" content="Immerse yourself in captivating audio stories. Stream anytime, anywhere." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%PUBLIC_URL%" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Story Go – Audio Stories" />
    <meta name="twitter:description" content="Immerse yourself in captivating audio stories." />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Story Go – Audio Stories & Series</title>

    <style>
        /* Critical CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; width: 100%; overflow-x: hidden;
            background-color: #08080C; color: #F0F0F5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        .app-loading {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #08080C 0%, #12122A 50%, #1A1A34 100%);
        }
        .app-loading-spinner {
            width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%; border-top-color: #4A90D9; animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <noscript>
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#08080C;color:#F0F0F5;font-family:sans-serif;text-align:center;padding:20px;">
            <div>
                <h1 style="font-size:2rem;margin-bottom:1rem;">JavaScript Required</h1>
                <p style="font-size:1.1rem;color:#B0B0C0;">Story Go requires JavaScript to be enabled. Please enable JavaScript and refresh the page.</p>
            </div>
        </div>
    </noscript>
    <div id="root">
        <div class="app-loading">
            <div class="app-loading-spinner"></div>
        </div>
    </div>
</body>
</html>
